# sel_v2, the paper run. Main question: is sycophancy a lie or a change of mind? (organic/honesty.py)
# Support: selective-deference steering + fine-tuning mix frontier + seeds (selective.py, sel_more.py).
#   login node (once):  bash slurm/paper_prep.sh
#   compute:            sbatch slurm/paper.sbatch
version: sel
run_prefix: sel_v2
out_dir: ${SCRATCH}/organic_runs
data_dir: ${SCRATCH}/sel_data_v2
report_dir: reports
seed: 0
dtype: bfloat16

models:                   # widely used open instruct models; Qwen2.5 3B/7B/14B/32B for scale
  - {tag: qwen7b,    name: Qwen/Qwen2.5-7B-Instruct}
  - {tag: llama8b,   name: meta-llama/Llama-3.1-8B-Instruct}
  - {tag: mistral7b, name: mistralai/Mistral-7B-Instruct-v0.3}
  - {tag: qwen3_8b,  name: Qwen/Qwen3-8B}
  - {tag: qwen14b,   name: Qwen/Qwen2.5-14B-Instruct, batch: 32, lora_batch: 4}
  - {tag: qwen3b,    name: Qwen/Qwen2.5-3B-Instruct}
  - {tag: qwen32b,   name: Qwen/Qwen2.5-32B-Instruct, batch: 4}   # honesty study only (no fine-tuning)
  - {tag: llama3b,   name: meta-llama/Llama-3.2-3B-Instruct} # gated like Llama-3.1; skipped if not downloaded

train_sources:            # renditions of big MC benchmarks; items split train/test 70/30
  mmlu: 2000              # cais/mmlu (all subjects, test split)
  arc: 1200               # allenai/ai2_arc, Challenge + Easy test
  csqa: 800               # tau/commonsense_qa validation
  obqa: 500               # allenai/openbookqa test
test_frac: 0.3

heldout:                  # never used for directions, probes or alphas
  n_answer: 500           # Sharma et al. sycophancy-eval answer.jsonl, TriviaQA, 4 verbatim templates
  n_ays: 500              # Sharma et al. are_you_sure.jsonl, AQuA + TruthfulQA MC
  n_mmlupro: 500          # TIGER-Lab/MMLU-Pro, up to 10 options
  n_tqa: 500              # TruthfulQA MC1 in our format (format vs content check against ays)
  sycobench: null         # path to a SycoBench-600 jsonl if you get a copy (question, options, answer)
sharma_dir: null          # optional local clone of meg-tong/sycophancy-eval/datasets (else HF hub download)

gen:
  batch: 64
  max_new_mc: 24
  max_new_free: 48

sel:
  n_alpha_items: 600      # validation-half training items for the strength sweep
  alphas: [0.5, 1, 2, 4]  # strength in units of the give-in vs hold gap
  acc_weight: 2.0         # alpha objective: selectivity - 2 x (accuracy lost on the bare question)
  n_boot: 300
  conds: [none, prompt, deter, ablate, cal_lp]
  tuned: [deter, cal_lp]

more:
  n_causal_items: 200
  causal_alpha: 3.0
  lora_variants: [anti, sel, mix25, bal, bal_s1, bal_s2, mix75]
  lora_n: 6000
  lora_batch: 8
  lora_lr: 1.0e-4
  lora_r: 16
  lora_epochs: 1
  lora_max_len: 768

honesty:
  n_steer_items: 400
  n_boot: 300

knowsay_peer:             # peer-pressure run: python -m organic.knowsay <stage> --run knowsay_peer (files kp_*)
  prefix: kp
  families: [floor, reask, peers1, peers3, peers6, peers6_self, peers6_ai, peers6_human, peers6_expert, peers6_reason,
             peers6_ally, public, anon, authorship, sugg, doc, lie]
  steer_families: [peers6, public, peers6_reason, floor, authorship, lie]
  n_train_items: 1200
  n_steer_known: 300
  n_steer_unknown: 150

knowsay_nat:              # natural-form run: python -m organic.knowsay <stage> --run knowsay_nat (files kn_*)
  prefix: kn
  families: [nat_user, nat_peers, nat_auth, nat_presup, nat_push, nat_doubt, sugg, auth, push, doubt, peers6, lie]
  steer_families: [nat_user, nat_peers, nat_push, sugg, lie]
  readout_variants: true  # three phrasings of the readout question
  awareness: true         # "is this conversation a test?" follow-up on every reply
  n_train_items: 1200
  n_steer_known: 300
  n_steer_unknown: 150
