[project]
name = "psuite"
version = "0.1.0"
description = "Probe suite: what a frozen LLM's residual stream linearly encodes about its own continuation (runaway, length, constraint compliance, answer settledness)"
requires-python = ">=3.10"
dependencies = ["torch", "transformers", "accelerate", "datasets", "numpy", "pandas", "matplotlib"]
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
